<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pampano — PDB Network Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1115; color: #e6e8eb; display: flex; height: 100vh; overflow: hidden;
  }
  #sidebar {
    width: 340px; min-width: 340px; background: #171a21; padding: 20px;
    overflow-y: auto; border-right: 1px solid #262b36;
  }
  #main { flex: 1; position: relative; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 2px; }
  .brand img {
    width: 40px; height: 40px; border-radius: 8px; object-fit: cover;
    border: 1px solid #2c3340; background: #0f1115; flex-shrink: 0;
  }
  .brand .fallback {
    width: 40px; height: 40px; border-radius: 8px; display: none;
    align-items: center; justify-content: center; font-size: 22px;
    border: 1px solid #2c3340; background: #11202b;
  }
  .sub { font-size: 12px; color: #8b93a1; margin-bottom: 20px; }
  label { display: block; font-size: 12px; color: #9aa3b2; margin: 14px 0 5px; }
  input[type=text], input[type=number], select {
    width: 100%; padding: 8px 10px; background: #0f1115; border: 1px solid #2c3340;
    border-radius: 6px; color: #e6e8eb; font-size: 13px;
  }
  input[type=file] { font-size: 12px; color: #9aa3b2; width: 100%; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  button {
    width: 100%; margin-top: 18px; padding: 10px; background: #3b82f6; border: none;
    border-radius: 6px; color: white; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #2563eb; }
  button:disabled { background: #2c3340; cursor: not-allowed; }
  button.secondary { background: #2c3340; margin-top: 8px; }
  button.secondary:hover { background: #374151; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; background: #2c3340; margin: 2px 2px 0 0; }
  #stats { margin-top: 16px; font-size: 12px; color: #9aa3b2; line-height: 1.7; }
  #stats b { color: #e6e8eb; }
  svg { width: 100%; height: 100%; display: block; }
  .node circle { stroke: #0f1115; stroke-width: 1.5px; cursor: grab; }
  .node text { font-size: 9px; fill: #cbd2dd; pointer-events: none; }
  .link { stroke-opacity: 0.5; }
  #tooltip {
    position: absolute; pointer-events: none; background: #1f2530; border: 1px solid #374151;
    border-radius: 6px; padding: 6px 10px; font-size: 12px; opacity: 0; transition: opacity .1s;
    max-width: 240px;
  }
  .legend { position: absolute; bottom: 14px; right: 14px; background: rgba(23,26,33,.9);
    padding: 10px 12px; border-radius: 8px; font-size: 11px; border: 1px solid #262b36; }
  .legend div { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; }
  details { margin-top: 10px; }
  summary { font-size: 12px; color: #9aa3b2; cursor: pointer; }
  .note { font-size: 11px; color: #6b7280; margin-top: 4px; }
</style>
</head>
<body>
<div id="sidebar">
  <div class="brand">
    <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1d/Pompano_common.jpg/500px-Pompano_common.jpg"
         alt="Pompano fish"
         onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
    <span class="fallback">🐟</span>
    <h1>Pampano</h1>
  </div>
  <div class="sub">Contacts &amp; bonds from structure</div>

  <label>PDB file (upload)</label>
  <input type="file" id="fileInput" accept=".pdb,.ent,.txt">

  <label>…or fetch by PDB ID</label>
  <div class="row">
    <div><input type="text" id="pdbId" placeholder="e.g. 1CRN" maxlength="4"></div>
    <div><button class="secondary" style="margin-top:0" id="fetchBtn">Fetch</button></div>
  </div>

  <label>Assembly</label>
  <select id="assemblyMode">
    <option value="monomer">Monomer (first chain)</option>
    <option value="asym">Full asymmetric unit (all chains as-is)</option>
    <option value="bioassembly">Biological assembly (apply BIOMT)</option>
  </select>
  <div class="note" id="asmNote"></div>

  <label>Network granularity</label>
  <select id="granularity">
    <option value="residue">Residue-level (nodes = residues)</option>
    <option value="atom">Atom-level (nodes = atoms)</option>
  </select>

  <label>Color nodes by</label>
  <select id="colorBy">
    <option value="chain">Chain</option>
    <option value="hydrophobicity">Hydrophobicity (Kyte-Doolittle)</option>
    <option value="sasa">Surface accessibility (SASA)</option>
    <option value="restype">Residue type (charge/polarity)</option>
    <option value="degree">Degree (contact count)</option>
  </select>

  <label>Size nodes by</label>
  <select id="sizeBy">
    <option value="uniform">Uniform</option>
    <option value="size">Residue size (volume)</option>
    <option value="sasa">Surface accessibility (SASA)</option>
    <option value="degree">Degree (contact count)</option>
  </select>

  <div class="row">
    <div>
      <label>Contact cutoff (Å)</label>
      <input type="number" id="cutoff" value="5.0" step="0.5" min="1">
    </div>
    <div>
      <label>Atoms</label>
      <select id="atomScope">
        <option value="all">All atoms</option>
        <option value="heavy" selected>Heavy only</option>
        <option value="ca">CA/representative</option>
      </select>
    </div>
  </div>

  <details>
    <summary>Advanced</summary>
    <label><input type="checkbox" id="covalentOnly"> Covalent bonds only (~1.9 Å)</label>
    <label><input type="checkbox" id="intraChain" checked> Include intra-chain contacts</label>
    <label><input type="checkbox" id="interChain" checked> Include inter-chain contacts</label>
    <label><input type="checkbox" id="excludeSeqAdj" checked> Exclude sequential neighbors (residue mode)</label>
    <label><input type="checkbox" id="includeHetatm"> Include HETATM (ligands/water)</label>
  </details>

  <label>Show edges</label>
  <select id="edgeFilter">
    <option value="all">Bonds + contacts</option>
    <option value="contacts">Contacts only (non-covalent)</option>
    <option value="bonds">Bonds only (covalent)</option>
  </select>

  <button id="buildBtn" disabled>Build Network</button>
  <button class="secondary" id="exportBtn" disabled>Export edges (CSV)</button>
  <button class="secondary" id="exportJsonBtn" disabled>Export graph (JSON)</button>

  <div id="stats"></div>
</div>

<div id="main">
  <svg id="graph"></svg>
  <div id="tooltip"></div>
  <div class="legend" id="legend" style="display:none"></div>
</div>

<script>
const $ = id => document.getElementById(id);
let parsed = null;   // {atoms, biomt}
let graph = null;    // {nodes, links}

// ---------- residue property tables ----------
// Kyte-Doolittle hydropathy (higher = more hydrophobic)
const KD = {ILE:4.5,VAL:4.2,LEU:3.8,PHE:2.8,CYS:2.5,MET:1.9,ALA:1.8,GLY:-0.4,
  THR:-0.7,SER:-0.8,TRP:-0.9,TYR:-1.3,PRO:-1.6,HIS:-3.2,GLU:-3.5,GLN:-3.5,
  ASP:-3.5,ASN:-3.5,LYS:-3.9,ARG:-4.5};
// residue volume (Å³, Zamyatnin)
const VOL = {GLY:60.1,ALA:88.6,SER:89.0,CYS:108.5,ASP:111.1,PRO:112.7,ASN:114.1,
  THR:116.1,GLU:138.4,VAL:140.0,GLN:143.8,HIS:153.2,MET:162.9,ILE:166.7,LEU:166.7,
  LYS:168.6,ARG:173.4,PHE:189.9,TYR:193.6,TRP:227.8};
// Tien et al. max SASA (Å²) for relative accessibility
const MAXASA = {ALA:129,ARG:274,ASN:195,ASP:193,CYS:167,GLU:223,GLN:225,GLY:104,
  HIS:224,ILE:197,LEU:201,LYS:236,MET:224,PHE:240,PRO:159,SER:155,THR:172,
  TRP:285,TYR:263,VAL:174};
// charge/polarity class
const RESCLASS = {ASP:"neg",GLU:"neg", LYS:"pos",ARG:"pos",HIS:"pos",
  SER:"polar",THR:"polar",ASN:"polar",GLN:"polar",TYR:"polar",CYS:"polar",
  GLY:"special",PRO:"special",
  ALA:"hydrophobic",VAL:"hydrophobic",LEU:"hydrophobic",ILE:"hydrophobic",
  MET:"hydrophobic",PHE:"hydrophobic",TRP:"hydrophobic"};
const CLASSCOLOR = {neg:"#ef4444", pos:"#3b82f6", polar:"#10b981",
  hydrophobic:"#f59e0b", special:"#a855f7", unknown:"#6b7280"};
// van der Waals radii (Å)
const VDW = {C:1.70, N:1.55, O:1.52, S:1.80, P:1.80, H:1.20, F:1.47,
  CL:1.75, BR:1.85, I:1.98, FE:2.0, ZN:1.39, MG:1.73, CA:2.31, NA:2.27};
function vdw(el){ return VDW[el] || 1.70; }

// ---------- Shrake-Rupley SASA ----------
// approximate per-atom solvent accessible surface area, summed to residues
function computeSASA(atoms, probe=1.4, nSphere=92) {
  // Fibonacci sphere sample points
  const pts = [];
  const gr = Math.PI * (3 - Math.sqrt(5));
  for (let i=0;i<nSphere;i++){
    const y = 1 - (i/(nSphere-1))*2, r = Math.sqrt(1-y*y), th = gr*i;
    pts.push([Math.cos(th)*r, y, Math.sin(th)*r]);
  }
  // spatial grid for neighbor lookup
  const maxR = 2.0 + probe*2 + 2.0;
  const cell = maxR, grid = new Map();
  const key=(i,j,k)=>i+","+j+","+k;
  atoms.forEach((a,idx)=>{
    const k=key(Math.floor(a.x/cell),Math.floor(a.y/cell),Math.floor(a.z/cell));
    if(!grid.has(k)) grid.set(k,[]); grid.get(k).push(idx);
  });
  const sasa = new Array(atoms.length).fill(0);
  atoms.forEach((a,idx)=>{
    const ri = vdw(a.element)+probe;
    // gather neighbors
    const ci=Math.floor(a.x/cell),cj=Math.floor(a.y/cell),ck=Math.floor(a.z/cell);
    const neigh=[];
    for(let di=-1;di<=1;di++)for(let dj=-1;dj<=1;dj++)for(let dk=-1;dk<=1;dk++){
      const b=grid.get(key(ci+di,cj+dj,ck+dk)); if(b) for(const n of b) if(n!==idx) neigh.push(n);
    }
    let accessible=0;
    for(const p of pts){
      const px=a.x+ri*p[0], py=a.y+ri*p[1], pz=a.z+ri*p[2];
      let buried=false;
      for(const n of neigh){
        const b=atoms[n], rj=vdw(b.element)+probe;
        const dx=px-b.x,dy=py-b.y,dz=pz-b.z;
        if(dx*dx+dy*dy+dz*dz < rj*rj){ buried=true; break; }
      }
      if(!buried) accessible++;
    }
    sasa[idx] = (accessible/nSphere) * 4*Math.PI*ri*ri;
  });
  return sasa; // per-atom Å²
}

// ---------- PDB parsing ----------
function parsePDB(text) {
  const atoms = [];
  const biomt = []; // list of {matrix:[[..],[..],[..]], trans:[x,y,z]} per operator
  let curOp = null;
  const lines = text.split(/\r?\n/);

  for (const line of lines) {
    const rec = line.slice(0, 6);

    if (rec === "ATOM  " || rec === "HETATM") {
      // Columns per PDB spec (1-indexed in spec; here 0-indexed slices)
      const atom = {
        hetatm: rec === "HETATM",
        serial: parseInt(line.slice(6, 11)),
        name: line.slice(12, 16).trim(),
        altLoc: line.slice(16, 17).trim(),
        resName: line.slice(17, 20).trim(),
        chain: line.slice(21, 22).trim() || "A",
        resSeq: parseInt(line.slice(22, 26)),
        iCode: line.slice(26, 27).trim(),
        x: parseFloat(line.slice(30, 38)),
        y: parseFloat(line.slice(38, 46)),
        z: parseFloat(line.slice(46, 54)),
        element: (line.slice(76, 78).trim() || line.slice(12, 14).trim().replace(/[0-9]/g, "")).toUpperCase()
      };
      // keep only first altLoc
      if (atom.altLoc === "" || atom.altLoc === "A") atoms.push(atom);
    }
    // REMARK 350 BIOMT records for biological assembly
    else if (rec === "REMARK" && line.slice(11, 18).trim() === "BIOMT1") {
      curOp = { matrix: [[0,0,0],[0,0,0],[0,0,0]], trans: [0,0,0] };
    }
    if (rec === "REMARK" && /BIOMT[123]/.test(line.slice(11, 20))) {
      const which = parseInt(line.slice(18, 19)) - 1; // row 0..2
      const nums = line.slice(23).trim().split(/\s+/).map(Number);
      // nums = [opNo, m1, m2, m3, t]
      if (nums.length >= 5 && which >= 0 && which <= 2) {
        if (which === 0 && !curOp) curOp = { matrix: [[0,0,0],[0,0,0],[0,0,0]], trans: [0,0,0] };
        if (curOp) {
          curOp.matrix[which] = [nums[1], nums[2], nums[3]];
          curOp.trans[which] = nums[4];
          if (which === 2) { biomt.push(curOp); curOp = null; }
        }
      }
    }
  }
  return { atoms, biomt };
}

function applyBiomt(atoms, biomt) {
  if (!biomt.length) return atoms.map(a => ({...a, opId: 0}));
  const out = [];
  biomt.forEach((op, oi) => {
    const [r0, r1, r2] = op.matrix, t = op.trans;
    for (const a of atoms) {
      out.push({
        ...a, opId: oi,
        x: r0[0]*a.x + r0[1]*a.y + r0[2]*a.z + t[0],
        y: r1[0]*a.x + r1[1]*a.y + r1[2]*a.z + t[1],
        z: r2[0]*a.x + r2[1]*a.y + r2[2]*a.z + t[2],
        chain: oi === 0 ? a.chain : a.chain + "_" + oi
      });
    }
  });
  return out;
}

// ---------- atom selection ----------
function selectAtoms(atoms, opts) {
  let a = atoms;
  if (!opts.includeHetatm) a = a.filter(x => !x.hetatm);
  if (opts.atomScope === "heavy") a = a.filter(x => x.element !== "H" && x.element !== "D");
  if (opts.atomScope === "ca") {
    a = a.filter(x => x.name === "CA" || x.name === "P" || (x.hetatm && x.element !== "H"));
  }
  return a;
}

// ---------- spatial grid for neighbor search ----------
function buildContacts(atoms, cutoff) {
  const cell = cutoff, grid = new Map();
  const key = (i,j,k) => i+","+j+","+k;
  atoms.forEach((a, idx) => {
    const i = Math.floor(a.x/cell), j = Math.floor(a.y/cell), k = Math.floor(a.z/cell);
    const kk = key(i,j,k);
    if (!grid.has(kk)) grid.set(kk, []);
    grid.get(kk).push(idx);
  });
  const c2 = cutoff*cutoff, pairs = [];
  atoms.forEach((a, idx) => {
    const i = Math.floor(a.x/cell), j = Math.floor(a.y/cell), k = Math.floor(a.z/cell);
    for (let di=-1; di<=1; di++) for (let dj=-1; dj<=1; dj++) for (let dk=-1; dk<=1; dk++) {
      const bucket = grid.get(key(i+di,j+dj,k+dk));
      if (!bucket) continue;
      for (const jdx of bucket) {
        if (jdx <= idx) continue;
        const b = atoms[jdx];
        const dx=a.x-b.x, dy=a.y-b.y, dz=a.z-b.z, d2=dx*dx+dy*dy+dz*dz;
        if (d2 <= c2) pairs.push([idx, jdx, Math.sqrt(d2)]);
      }
    }
  });
  return pairs;
}

// ---------- bond classification ----------
// decide if an atom pair is covalently bonded, from element-aware distance
function isCovalent(elA, elB, d) {
  if (elA === "S" && elB === "S") return d <= 2.4;   // disulfide ~2.05 Å
  return d <= 1.95;                                   // generic covalent ceiling
}

// ---------- build graph ----------
function buildGraph(atoms, opts) {
  const effCutoff = opts.covalentOnly ? 1.9 : opts.cutoff;
  const sel = selectAtoms(atoms, opts);
  const pairs = buildContacts(sel, effCutoff);

  // SASA needed? compute per-atom on heavy atoms, then map back onto sel
  let atomSASA = null;
  const needSASA = opts.colorBy === "sasa" || opts.sizeBy === "sasa";
  if (needSASA) {
    const heavy = sel.filter(a => a.element !== "H" && a.element !== "D");
    const s = computeSASA(heavy);
    atomSASA = new Map();
    heavy.forEach((a,i)=> atomSASA.set(a, s[i]));
  }

  if (opts.granularity === "atom") {
    const nodes = sel.map((a,i) => ({
      id: i, label: a.name,
      group: a.chain, chain: a.chain,
      resName: a.resName,
      hydro: KD[a.resName] ?? null,
      vol: VOL[a.resName] ?? null,
      sasa: atomSASA ? (atomSASA.get(a) ?? 0) : null,
      relsasa: null,
      resclass: RESCLASS[a.resName] || "unknown",
      title: `${a.chain} ${a.resName}${a.resSeq} ${a.name}`
    }));
    const links = pairs.filter(([i,j]) => {
      const sameChain = sel[i].chain === sel[j].chain;
      if (sameChain && !opts.intraChain) return false;
      if (!sameChain && !opts.interChain) return false;
      return true;
    }).map(([i,j,d]) => ({source:i, target:j, dist:d,
      inter: sel[i].chain !== sel[j].chain,
      bond: isCovalent(sel[i].element, sel[j].element, d)}));
    return {nodes, links};
  }

  // residue-level: collapse pairs to residue-residue
  const resKey = a => `${a.chain}|${a.resSeq}|${a.iCode}|${a.resName}`;
  const resMap = new Map();
  sel.forEach(a => {
    const k = resKey(a);
    if (!resMap.has(k)) resMap.set(k, {key:k, chain:a.chain, resSeq:a.resSeq,
      resName:a.resName, iCode:a.iCode, sasa:0});
    if (atomSASA && atomSASA.has(a)) resMap.get(k).sasa += atomSASA.get(a);
  });
  const resList = [...resMap.values()];
  const resIndex = new Map(resList.map((r,i)=>[r.key,i]));

  const edgeAgg = new Map(); // "i-j" -> {count, minDist}
  for (const [i,j,d] of pairs) {
    const ri = resIndex.get(resKey(sel[i])), rj = resIndex.get(resKey(sel[j]));
    if (ri === rj) continue;
    const a = resList[ri], b = resList[rj];
    const sameChain = a.chain === b.chain;
    if (sameChain && !opts.intraChain) continue;
    if (!sameChain && !opts.interChain) continue;
    if (opts.excludeSeqAdj && sameChain && Math.abs(a.resSeq - b.resSeq) <= 1) continue;
    const lo = Math.min(ri,rj), hi = Math.max(ri,rj), ek = lo+"-"+hi;
    if (!edgeAgg.has(ek)) edgeAgg.set(ek, {source:lo, target:hi, count:0, dist:Infinity,
      inter: !sameChain, bond:false});
    const e = edgeAgg.get(ek); e.count++; e.dist = Math.min(e.dist, d);
    if (isCovalent(sel[i].element, sel[j].element, d)) e.bond = true;
  }

  const nodes = resList.map((r,i)=>({
    id:i, label:`${r.resName}${r.resSeq}`, group:r.chain, chain:r.chain,
    resName:r.resName,
    hydro: KD[r.resName] ?? null,
    vol: VOL[r.resName] ?? null,
    sasa: needSASA ? r.sasa : null,
    relsasa: needSASA && MAXASA[r.resName] ? Math.min(r.sasa/MAXASA[r.resName],1) : null,
    resclass: RESCLASS[r.resName] || "unknown",
    title:`${r.chain} ${r.resName} ${r.resSeq}${r.iCode}`
  }));
  const links = [...edgeAgg.values()];
  // drop isolated nodes
  const used = new Set();
  links.forEach(l => { used.add(l.source); used.add(l.target); });
  const remap = new Map(); let n=0;
  const fnodes = nodes.filter(nd => used.has(nd.id)).map(nd => { remap.set(nd.id, n); return {...nd, id:n++}; });
  const flinks = links.map(l => ({...l, source:remap.get(l.source), target:remap.get(l.target)}));
  return {nodes:fnodes, links:flinks};
}

// ---------- rendering ----------
let sim = null;
const idOf = x => (x && typeof x === "object") ? x.id : x;
function render(g, opts) {
  const svg = d3.select("#graph");
  svg.selectAll("*").remove();
  const W = svg.node().clientWidth, H = svg.node().clientHeight;

  // edge type filter
  let shownLinks = g.links;
  if (opts.edgeFilter === "contacts") shownLinks = g.links.filter(l => !l.bond);
  else if (opts.edgeFilter === "bonds") shownLinks = g.links.filter(l => l.bond);

  // compute degree (from shown links)
  const deg = new Array(g.nodes.length).fill(0);
  shownLinks.forEach(l => { deg[idOf(l.source)]++; deg[idOf(l.target)]++; });
  g.nodes.forEach((n,i)=> n.degree = deg[i]);

  const chains = [...new Set(g.nodes.map(n=>n.chain))];
  const chainColor = d3.scaleOrdinal(d3.schemeTableau10).domain(chains);

  // ----- color scale -----
  let colorFn, legendItems, legendTitle;
  const cb = opts.colorBy;
  if (cb === "hydrophobicity") {
    const sc = d3.scaleSequential(d3.interpolateRdYlBu).domain([4.5,-4.5]); // red=hydrophobic
    colorFn = n => n.hydro==null ? "#6b7280" : sc(n.hydro);
    legendTitle = "Hydrophobicity";
    legendItems = [["#a50026","hydrophobic (+4.5)"],["#ffffbf","neutral (0)"],["#313695","hydrophilic (−4.5)"]];
  } else if (cb === "sasa") {
    const vals = g.nodes.map(n=>n.relsasa ?? n.sasa ?? 0);
    const mx = d3.max(vals)||1;
    const useRel = g.nodes.some(n=>n.relsasa!=null);
    const sc = d3.scaleSequential(d3.interpolateViridis).domain([0, useRel?1:mx]);
    colorFn = n => sc(useRel ? (n.relsasa??0) : (n.sasa??0));
    legendTitle = "Surface accessibility";
    legendItems = [[d3.interpolateViridis(1),"exposed"],[d3.interpolateViridis(0.5),"partial"],[d3.interpolateViridis(0),"buried"]];
  } else if (cb === "restype") {
    colorFn = n => CLASSCOLOR[n.resclass] || CLASSCOLOR.unknown;
    legendTitle = "Residue type";
    legendItems = [["#ef4444","acidic (−)"],["#3b82f6","basic (+)"],["#10b981","polar"],
      ["#f59e0b","hydrophobic"],["#a855f7","Gly/Pro"]];
  } else if (cb === "degree") {
    const mx = d3.max(deg)||1;
    const sc = d3.scaleSequential(d3.interpolateYlOrRd).domain([0,mx]);
    colorFn = n => sc(n.degree);
    legendTitle = "Degree";
    legendItems = [[d3.interpolateYlOrRd(1),`high (${mx})`],[d3.interpolateYlOrRd(0.4),"mid"],[d3.interpolateYlOrRd(0),"low (0)"]];
  } else {
    colorFn = n => chainColor(n.chain);
    legendTitle = "Chain";
    legendItems = chains.map(c=>[chainColor(c),"chain "+c]);
  }

  // ----- size scale -----
  let sizeFn;
  const sb = opts.sizeBy, baseR = g.nodes.length > 400 ? 4 : 6;
  if (sb === "size") {
    const sc = d3.scaleSqrt().domain([60,228]).range([3,12]);
    sizeFn = n => n.vol==null ? baseR : sc(n.vol);
  } else if (sb === "sasa") {
    const vals = g.nodes.map(n=>n.sasa??0); const mx=d3.max(vals)||1;
    const sc = d3.scaleSqrt().domain([0,mx]).range([3,13]);
    sizeFn = n => sc(n.sasa??0);
  } else if (sb === "degree") {
    const mx=d3.max(deg)||1;
    const sc = d3.scaleSqrt().domain([0,mx]).range([3,14]);
    sizeFn = n => sc(n.degree);
  } else {
    sizeFn = () => baseR;
  }
  g.nodes.forEach(n => n.r = sizeFn(n));

  const zoomG = svg.append("g");
  svg.call(d3.zoom().scaleExtent([0.1, 8]).on("zoom", e => zoomG.attr("transform", e.transform)));

  const link = zoomG.append("g").selectAll("line").data(shownLinks).enter().append("line")
    .attr("class","link")
    .attr("stroke", d => d.bond ? "#22d3ee" : (d.inter ? "#f59e0b" : "#4b5563"))
    .attr("stroke-width", d => d.bond ? 2.5 : (d.count ? Math.min(1+Math.log(d.count), 4) : 1))
    .attr("stroke-dasharray", d => d.bond ? "none" : "3,2")
    .attr("stroke-opacity", d => d.bond ? 0.95 : 0.5);

  const node = zoomG.append("g").selectAll("g").data(g.nodes).enter().append("g")
    .attr("class","node").call(drag());

  node.append("circle").attr("r", d=>d.r).attr("fill", colorFn);
  if (g.nodes.length <= 300)
    node.append("text").attr("dx", d=>d.r+2).attr("dy", 3).text(d => d.label);

  const tip = $("tooltip");
  node.on("mousemove", (e,d) => {
    tip.style.opacity = 1; tip.style.left = (e.offsetX+14)+"px"; tip.style.top = (e.offsetY+14)+"px";
    let extra = `chain ${d.chain} · degree ${d.degree}`;
    if (d.hydro!=null) extra += `<br>hydropathy ${d.hydro}`;
    if (d.vol!=null) extra += ` · vol ${d.vol} Å³`;
    if (d.sasa!=null) extra += `<br>SASA ${d.sasa.toFixed(1)} Å²`
      + (d.relsasa!=null ? ` (${(d.relsasa*100).toFixed(0)}% exp.)` : "");
    tip.innerHTML = `<b>${d.title}</b><br>${extra}`;
  }).on("mouseout", () => tip.style.opacity = 0);

  sim = d3.forceSimulation(g.nodes)
    .force("link", d3.forceLink(shownLinks).id(d=>d.id).distance(30).strength(0.4))
    .force("charge", d3.forceManyBody().strength(g.nodes.length>400 ? -20 : -60))
    .force("center", d3.forceCenter(W/2, H/2))
    .force("collide", d3.forceCollide(d=>d.r+2))
    .on("tick", () => {
      link.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y)
          .attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
      node.attr("transform", d=>`translate(${d.x},${d.y})`);
    });

  // legend
  const lg = $("legend"); lg.style.display="block";
  lg.innerHTML = `<div style="font-weight:600;margin-bottom:4px">${legendTitle}</div>`
    + legendItems.map(([c,t])=>`<div><span class="swatch" style="background:${c}"></span>${t}</div>`).join("")
    + `<div style="font-weight:600;margin:6px 0 4px">Edges</div>`
    + `<div><span class="swatch" style="background:#22d3ee"></span>covalent bond</div>`
    + `<div><span class="swatch" style="background:#4b5563"></span>contact (dashed)</div>`
    + `<div><span class="swatch" style="background:#f59e0b"></span>inter-chain contact</div>`;
}

function drag() {
  return d3.drag()
    .on("start", (e,d) => { if(!e.active) sim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
    .on("drag", (e,d) => { d.fx=e.x; d.fy=e.y; })
    .on("end", (e,d) => { if(!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; });
}

// ---------- options reader ----------
function readOpts() {
  return {
    assemblyMode: $("assemblyMode").value,
    granularity: $("granularity").value,
    colorBy: $("colorBy").value,
    sizeBy: $("sizeBy").value,
    edgeFilter: $("edgeFilter").value,
    cutoff: parseFloat($("cutoff").value),
    atomScope: $("atomScope").value,
    covalentOnly: $("covalentOnly").checked,
    intraChain: $("intraChain").checked,
    interChain: $("interChain").checked,
    excludeSeqAdj: $("excludeSeqAdj").checked,
    includeHetatm: $("includeHetatm").checked
  };
}

function prepareAtoms(opts) {
  let atoms = parsed.atoms;
  if (opts.assemblyMode === "monomer") {
    const firstChain = atoms.find(a=>!a.hetatm)?.chain;
    atoms = atoms.filter(a => a.chain === firstChain);
    atoms = atoms.map(a=>({...a, opId:0}));
  } else if (opts.assemblyMode === "bioassembly") {
    atoms = applyBiomt(atoms, parsed.biomt);
  } else {
    atoms = atoms.map(a=>({...a, opId:0}));
  }
  return atoms;
}

// ---------- events ----------
$("fileInput").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  const text = await f.text();
  loadText(text, f.name);
});

$("fetchBtn").addEventListener("click", async () => {
  const id = $("pdbId").value.trim().toLowerCase();
  if (id.length !== 4) { alert("Enter a 4-character PDB ID"); return; }
  $("fetchBtn").textContent = "…";
  try {
    const r = await fetch(`https://files.rcsb.org/download/${id}.pdb`);
    if (!r.ok) throw new Error("not found");
    loadText(await r.text(), id.toUpperCase());
  } catch(err) {
    alert("Could not fetch " + id + ". Check the ID or upload the file.");
  }
  $("fetchBtn").textContent = "Fetch";
});

function loadText(text, name) {
  parsed = parsePDB(text);
  $("buildBtn").disabled = false;
  const chains = [...new Set(parsed.atoms.filter(a=>!a.hetatm).map(a=>a.chain))];
  $("asmNote").textContent = parsed.biomt.length
    ? `${parsed.biomt.length} BIOMT operator(s) found.`
    : "No BIOMT records; bio-assembly = asym unit.";
  $("stats").innerHTML = `<b>${name}</b> loaded<br>`
    + `${parsed.atoms.length} atoms, ${chains.length} chain(s)<br>`
    + chains.map(c=>`<span class="pill">${c}</span>`).join("");
}

$("buildBtn").addEventListener("click", () => {
  const opts = readOpts();
  const atoms = prepareAtoms(opts);
  $("buildBtn").textContent = "Building…"; $("buildBtn").disabled = true;
  setTimeout(() => {
    graph = buildGraph(atoms, opts);
    render(graph, opts);
    $("exportBtn").disabled = false;
    $("exportJsonBtn").disabled = false;
    const interN = graph.links.filter(l=>l.inter).length;
    const bondN = graph.links.filter(l=>l.bond).length;
    const contactN = graph.links.length - bondN;
    $("stats").innerHTML = $("stats").innerHTML.split("<br><b>Network:</b>")[0]
      + `<br><b>Network:</b> ${graph.nodes.length} nodes, ${graph.links.length} edges`
      + `<br>${bondN} bonds · ${contactN} contacts · ${interN} inter-chain`;
    $("buildBtn").textContent = "Build Network"; $("buildBtn").disabled = false;
  }, 20);
});

// re-render with new visual mappings; rebuild only if SASA newly required
function reStyle() {
  if (!graph) return;
  const opts = readOpts();
  const needSASA = opts.colorBy === "sasa" || opts.sizeBy === "sasa";
  const haveSASA = graph.nodes.some(n => n.sasa != null);
  if (needSASA && !haveSASA) {
    $("buildBtn").click(); // rebuild to compute SASA
  } else {
    render(graph, opts);
  }
}
$("colorBy").addEventListener("change", reStyle);
$("sizeBy").addEventListener("change", reStyle);

$("exportBtn").addEventListener("click", () => {
  if (!graph) return;
  const header = "source,target,source_label,target_label,distance,count,edge_type,inter_chain\n";
  const rows = graph.links.map(l => {
    const s = graph.nodes.find(n=>n.id===idOf(l.source));
    const t = graph.nodes.find(n=>n.id===idOf(l.target));
    return [s.id, t.id, s.title, t.title,
      (typeof l.dist==="number") ? l.dist.toFixed(2) : l.dist,
      l.count||1, l.bond?"bond":"contact", l.inter?1:0].join(",");
  }).join("\n");
  download(header+rows, "pampano_edges.csv", "text/csv");
});

$("exportJsonBtn").addEventListener("click", () => {
  if (!graph) return;
  const clean = {
    nodes: graph.nodes.map(n=>({id:n.id, label:n.label, chain:n.chain, title:n.title,
      resName:n.resName, hydropathy:n.hydro, volume:n.vol, sasa:n.sasa, degree:n.degree})),
    links: graph.links.map(l=>({source:idOf(l.source), target:idOf(l.target),
      distance:l.dist, count:l.count||1, edge_type:l.bond?"bond":"contact",
      inter_chain:!!l.inter}))
  };
  download(JSON.stringify(clean,null,2), "pampano_network.json", "application/json");
});

function download(content, name, type) {
  const blob = new Blob([content], {type});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  URL.revokeObjectURL(a.href);
}

$("assemblyMode").addEventListener("change", e => {
  $("asmNote").textContent = e.target.value === "bioassembly" && parsed && !parsed.biomt.length
    ? "No BIOMT records; will use asym unit." : "";
});
</script>
</body>
