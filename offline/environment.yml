# Conda environment for the Pampano offline tool.
#   conda env create -f environment.yml
#   conda activate pampano
# Optional: any Python 3.8+ that already has numpy and scipy works too.
name: pampano
channels:
  - conda-forge
dependencies:
  - python>=3.10
  - numpy>=1.20
  - scipy>=1.6
  - truststore  # lets --pdb-id downloads trust your OS certificates (institutional networks)
